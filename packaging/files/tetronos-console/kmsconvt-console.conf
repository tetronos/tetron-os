# kmscon on a virtual console: DejaVu Sans Mono, us keyboard, mouse on (kmscon provides the mouse
# tetron-wm uses), login through agetty. TERM is the literal xterm-256color: inside a unit $TERM
# would be "linux", and tetron-wm would then fall back to 16 colors and gpm. The live ISO adds
# an autologin on top of this in kmsconvt@tty1.service.d (tetronos-live-config).
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon "--vt=%I" --no-switchvt --mouse --xkb-layout=us "--font-name=DejaVu Sans Mono" --font-size=14 --login -- /sbin/agetty --noclear - xterm-256color
