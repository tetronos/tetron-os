# kmscon on tty1 with autologin of the live user. TERM is the literal
# xterm-256color: inside a unit $TERM would be "linux", and tetron-wm would
# then fall back to 16 colors and gpm.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon "--vt=%I" --seats=seat0 --no-switchvt --mouse --xkb-layout=us "--font-name=DejaVu Sans Mono" --font-size=14 --login -- /sbin/agetty --autologin tetron --noclear - xterm-256color
