[[package]]
name = "tetronos-core"
kind = "meta"
version = "0.15.0"
revision = "1"
arch = "all"
section = "metapackages"
description = "TetronOS Server edition package set"
long_description = """
Installs the tetron mesh VPN (daemon and CLI), its terminal dashboard
tetron-tui, the tetron-wm terminal window manager, an SSH server and
NetworkManager. Desktop apps are not included: see tetronos-suite.
"""
depends = ["tetron (>= 0.15)", "tetron-tui (>= 0.15)", "tetron-wm (>= 0.15)",
           "openssh-server", "network-manager"]

[[package]]
name = "tetronos-suite"
kind = "meta"
version = "0.15.0"
revision = "1"
arch = "all"
section = "metapackages"
description = "TetronOS with the full tetron suite"
long_description = """
Installs tetronos-core, tetron-wm-extras (tetron-wm-desktop and the
terminal apps that tetron-wm features use), the tetron web dashboard
tetron-webui and its message board addon tetron-messageboard.
"""
depends = ["tetronos-core (= 0.15.0-1)", "tetron-wm-extras (>= 0.15)",
           "tetron-webui (>= 0.15)", "tetron-messageboard (>= 0.15)"]
