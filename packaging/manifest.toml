# Single source of truth for the TetronOS .debs. See spec/packaging.py.
# kind = "deb": the component's release .deb, verified and used unchanged.
# kind = "meta": a metapackage built here from the entry alone (no download).
# kind = "local": built here from files under packaging/files/<name>/ (no download).
# Other packages are built here from a release binary (none at the moment);
# their Maintainer is the placeholder below until USER decides (plan open item 6).
source_date_epoch = 1792998000
maintainer = "TetronOS <noreply@tetron.invalid>"

[[package]]
name = "tetron"
kind = "deb"
version = "0.15.0"
revision = "1"
arch = "amd64"
smoke = "tetron --version"

