# Single source of truth for the TetronOS .debs. See spec/packaging.py.
# kind = "deb": the component's release .deb, verified and used unchanged.
# kind = "meta": a metapackage built here from the entry alone (no download).
# kind = "local": built here from files under packaging/files/<name>/ (no download).
# kind = "source": built here from a Debian source package in a debian:trixie container (docker);
#   `build` is a script in a directory that is mounted at /src (packaging/kmscon/). Cached.
# Other packages are built here from a release binary (none at the moment);
# their Maintainer is the placeholder below until USER decides (plan open item 6).
#
# Relations between packages built here (kind meta, local, release); build.py refuses others:
# 1. Write "name (>= FLOOR)", "name (<< NEXT_MINOR)" (e.g. "tetronos-core (>= 0.15.0-6)",
#    "tetronos-core (<< 0.16)"), never "=". The ceiling keeps one core minor together.
# 2. FLOOR is the lowest revision with what the dependent uses: raise it in the commit that
#    starts using something new. A changed package needs only its own new revision.
# 3. Removing or renaming something another package here uses: add breaks = ["other (<< FIXED)"]
#    and ship the fixed other in the same release.
# 4. A file moving from package A to B: B gets breaks and replaces = ["A (<< V)"], V the first
#    A revision without the file (Debian policy 7.6).
# 5. Every change to a package gets a new revision (the apt repo holds one .deb per version).
# The release workflow upgrades the previous release to this one and fails on removals.
source_date_epoch = 1792998000
maintainer = "TetronOS <noreply@tetron.invalid>"

