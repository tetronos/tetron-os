kind = "local"
version = "0.15.0"
revision = "4"
arch = "all"
section = "admin"
description = "TetronOS config shared by every edition"
long_description = """
Creates Desktop, Documents, Downloads, Pictures and code in /etc/skel so every
new user (and the live user) has the folders the tetron-wm Files app expects and
~/code, and lets every
user ping (ICMP datagram sockets, net.ipv4.ping_group_range). Removing the
package deletes those folders from /etc/skel when they are empty.
tetronos-ssh-temp gives temporary ssh access with a username and a password
you enter, until the next reboot (the Settings row in tetron-wm runs it); a
systemd unit ends a leftover one at boot.
"""

