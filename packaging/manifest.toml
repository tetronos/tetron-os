[[package]]
name = "tetronos-core"
kind = "meta"
version = "0.15.0"
revision = "10"
arch = "all"
section = "metapackages"
description = "TetronOS base package set of every edition"
long_description = """
Installs the tetron mesh VPN (daemon and CLI), its terminal dashboard
tetron-tui, the tetron-wm terminal window manager, NetworkManager and the
kmscon console (from trixie-backports) and the symbols Nerd Font for
tetron-wm icons. libpam-systemd and dbus-user-session give the console
login a logind session, a systemd user manager and a session bus from the
first boot, so user services such as PipeWire start. The SSH server comes with
tetronos-server, hardware and sound with tetronos-desktop.
"""
depends = ["tetron (>= 0.15.3)", "tetron-tui (>= 0.15)", "tetron-wm (>= 0.15)",
           "tetronos-branding (>= 0.15.0-1)", "tetronos-branding (<< 0.16)", "tetronos-firstboot (>= 0.15.0-2)", "tetronos-firstboot (<< 0.16)",
           "tetronos-base-config (>= 0.15.0-4)", "tetronos-base-config (<< 0.16)", "tetronos-apt-source (>= 0.15.0-2)", "tetronos-apt-source (<< 0.16)",
           "tetronos-nerd-font-symbols (>= 0.15.0-1)", "tetronos-nerd-font-symbols (<< 0.16)", "network-manager", "curl", "iputils-ping",
           "kmscon (>= 10)", "libpam-systemd", "dbus-user-session",
           "tetronos-install (>= 0.15.0-7)", "tetronos-install (<< 0.16)",
           "tetronos-console (>= 0.15.0-1)", "tetronos-console (<< 0.16)", "fonts-dejavu-core"]

[[package]]
name = "tetronos-firmware-wifi"
kind = "meta"
version = "0.15.0"
revision = "1"
arch = "all"
section = "metapackages"
description = "TetronOS wifi firmware and wifi stack"
long_description = """
The firmware of the common wifi chips (Intel, Realtek, MediaTek, Qualcomm
Atheros, Broadcom, and the wifi parts of firmware-misc-nonfree) with
wpasupplicant, iw and wireless-regdb, so NetworkManager can drive the radio.
Part of every TetronOS tier: a laptop with only wifi has no network to fetch
firmware from. Needs the Debian contrib and non-free-firmware components.
"""
depends = ["firmware-iwlwifi", "firmware-realtek", "firmware-mediatek", "firmware-atheros", "firmware-brcm80211",
           "firmware-misc-nonfree", "wpasupplicant", "iw", "wireless-regdb"]

[[package]]
name = "tetronos-firmware"
kind = "meta"
version = "0.15.0"
revision = "2"
arch = "all"
section = "metapackages"
description = "TetronOS hardware firmware set"
long_description = """
The rest of the hardware firmware on top of tetronos-firmware-wifi: graphics
(AMD, Intel, Nvidia), network cards, sound (SOF, Cirrus), USB wifi and TV
adapters, and CPU microcode, with pipewire-alsa and wireplumber (the ISO
installs no Recommends) so the sound card plays through PipeWire. Install it on a Server to get the Server with
firmware tier: sudo apt install tetronos-firmware. Needs the Debian
non-free-firmware component.
"""
