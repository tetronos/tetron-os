[[package]]
name = "tetron-browser"
version = "0.0.3+tetron1"
revision = "1"
arch = "amd64"
section = "web"
license = "BSD-3-Clause"
homepage = "https://github.com/ErikAllanKincaid/tetron-browser"
description = "Chromium based web browser that runs in a terminal"
long_description = """
tetron-browser renders web pages with Chromium and draws them in the
terminal with truecolor blocks, with mouse and keyboard input. It is a
maintained continuation of Carbonyl: the Carbonyl v0.0.3 Chromium runtime
with a rebuilt libcarbonyl.so that no longer crashes when the window is
resized very small. Its files are in /usr/lib/tetron-browser.
"""
depends = ["libnss3", "libnspr4", "libexpat1", "libasound2t64"]
replaces = ["carbonyl"]
conflicts = ["carbonyl"]
smoke = "tetron-browser --version"

[package.source]
url = "https://github.com/ErikAllanKincaid/tetron-browser/releases/download/v0.0.3-tetron1/tetron-browser.linux-amd64.zip"
sha256 = "ac410d7868353f12606ca380b04b665615289ed32a22db228d31dc3f39540628"

[[package.trees]]
src = "tetron-browser-0.0.3+tetron1"
dst = "usr/lib/tetron-browser"

[[package.files]]
src = "files/tetron-browser/tetron-browser"
dst = "usr/bin/tetron-browser"
mode = "0755"

[[package.files]]
src = "files/tetron-browser/copyright"
dst = "usr/share/doc/tetron-browser/copyright"
mode = "0644"

[[package]]
name = "tetronos-branding"
kind = "local"
version = "0.15.0"
revision = "1"
arch = "all"
section = "admin"
description = "TetronOS greeting text for the console, ssh and login"
long_description = """
Diverts /etc/issue, /etc/issue.net and /etc/motd from base-files and
points them at the TetronOS greeting. Removing the package restores the
Debian files.
"""
depends = ["base-files"]

[[package.files]]
src = "files/tetronos-branding/issue"
dst = "usr/share/tetronos-branding/issue"
mode = "0644"

[[package.files]]
src = "files/tetronos-branding/issue.net"
dst = "usr/share/tetronos-branding/issue.net"
mode = "0644"

[[package.files]]
src = "files/tetronos-branding/motd"
dst = "usr/share/tetronos-branding/motd"
mode = "0644"

[package.scripts]
postinst = "files/tetronos-branding/postinst"
postrm = "files/tetronos-branding/postrm"

[[package]]
name = "tetronos-base-config"
kind = "local"
version = "0.15.0"
revision = "2"
arch = "all"
section = "admin"
description = "TetronOS config shared by every edition"
long_description = """
Creates Desktop, Documents, Downloads and Pictures in /etc/skel so every
new user has the folders the tetron-wm Files app expects, and lets every
user ping (ICMP datagram sockets, net.ipv4.ping_group_range). Removing the
package deletes those folders from /etc/skel when they are empty.
"""

[[package.files]]
src = "files/tetronos-base-config/50-tetronos-ping.conf"
dst = "usr/lib/sysctl.d/50-tetronos-ping.conf"
mode = "0644"

[package.scripts]
postinst = "files/tetronos-base-config/postinst"
postrm = "files/tetronos-base-config/postrm"

[[package]]
name = "tetronos-firstboot"
kind = "local"
version = "0.15.0"
revision = "2"
arch = "all"
section = "admin"
description = "TetronOS first boot: tetron operator and pending invite join"
long_description = """
A oneshot unit that runs once per system after the tetron daemon starts:
it makes the primary user the tetron operator and, if the installer left
an invite in /etc/tetron/pending-invite, joins that mesh and deletes the
invite. The unit is enabled by the image or the installer, not by the
package.
"""
depends = ["tetron (>= 0.15.3)", "network-manager"]

[[package.files]]
src = "files/tetronos-firstboot/tetronos-firstboot.service"
dst = "usr/lib/systemd/system/tetronos-firstboot.service"
mode = "0644"

[[package.files]]
src = "files/tetronos-firstboot/firstboot"
dst = "usr/libexec/tetronos/firstboot"
mode = "0755"

[[package]]
name = "tetronos-core"
kind = "meta"
version = "0.15.0"
revision = "4"
arch = "all"
section = "metapackages"
description = "TetronOS base package set of every edition"
long_description = """
Installs the tetron mesh VPN (daemon and CLI), its terminal dashboard
tetron-tui, the tetron-wm terminal window manager, NetworkManager and the
kmscon console (from trixie-backports). The SSH server comes with
tetronos-server, hardware and sound with tetronos-desktop.
"""
depends = ["tetron (>= 0.15.3)", "tetron-tui (>= 0.15)", "tetron-wm (>= 0.15)",
           "tetronos-branding (= 0.15.0-1)", "tetronos-firstboot (= 0.15.0-2)",
           "tetronos-base-config (= 0.15.0-2)", "network-manager", "curl", "iputils-ping",
           "kmscon (>= 10)"]

[[package]]
name = "tetronos-server"
kind = "meta"
version = "0.15.0"
revision = "4"
arch = "all"
section = "metapackages"
description = "TetronOS Server edition package set"
long_description = """
Installs tetronos-core, an SSH server, and python3 with python3-apt so
Ansible can manage the machine.
"""
depends = ["tetronos-core (= 0.15.0-4)", "openssh-server", "python3", "python3-apt"]

[[package]]
name = "tetronos-desktop-config"
kind = "local"
version = "0.15.0"
revision = "1"
arch = "all"
section = "admin"
description = "TetronOS desktop: polkit rules for console logins"
long_description = """
kmscon runs the login on a pseudo terminal, so the session is not an
active seat session. These polkit rules let members of netdev manage
NetworkManager and members of users power off, reboot and suspend.
"""
depends = ["polkitd"]

[[package.files]]
src = "files/tetronos-desktop-config/50-tetronos-desktop.rules"
dst = "usr/share/polkit-1/rules.d/50-tetronos-desktop.rules"
mode = "0644"

[[package]]
name = "tetronos-desktop"
kind = "meta"
version = "0.15.0"
revision = "6"
arch = "all"
section = "metapackages"
description = "TetronOS Desktop edition package set"
long_description = """
Installs tetronos-server plus what a laptop or desktop needs: polkit and
a logind session for the console login, wifi (wpasupplicant), sound
(PipeWire), bluetooth, backlight and battery tools, CPU microcode and the
tools tetron-wm features use (tetron-wm-desktop). The SSH server is
installed; a fresh Desktop install leaves it off.
"""
depends = ["tetronos-server (= 0.15.0-4)", "tetronos-desktop-config (= 0.15.0-1)",
           "tetron-wm-desktop (>= 0.15)", "polkitd", "libpam-systemd", "dbus-user-session",
           "wpasupplicant", "wireless-regdb", "iw", "pipewire", "pipewire-alsa",
           "pipewire-pulse", "wireplumber", "alsa-utils", "bluez", "brightnessctl",
           "upower", "rtkit", "intel-microcode", "amd64-microcode", "tetron-browser (>= 0.0.3+tetron1)"]

[[package]]
name = "tetronos-suite"
kind = "meta"
version = "0.15.0"
revision = "4"
arch = "all"
section = "metapackages"
description = "TetronOS with the full tetron suite"
long_description = """
Installs tetronos-core, tetron-wm-extras (tetron-wm-desktop and the
terminal apps that tetron-wm features use), the tetron web dashboard
tetron-webui and its message board addon tetron-messageboard.
"""
depends = ["tetronos-core (= 0.15.0-4)", "tetron-wm-extras (>= 0.15)",
           "tetron-webui (>= 0.15)", "tetron-messageboard (>= 0.15)"]

[[package]]
name = "tetronos-live-config"
kind = "local"
version = "0.15.0"
revision = "4"
arch = "all"
section = "admin"
description = "TetronOS live medium: kmscon console with autologin to tetron-wm"
long_description = """
Runs kmscon on tty1 with autologin of the live user tetronos and starts
tetron-wm in that login. Installed only on the TetronOS live ISO; the
live user and its sudo rights come from live-config.
"""
depends = ["tetronos-core (= 0.15.0-4)", "live-boot", "live-config", "live-config-systemd",
           "user-setup", "sudo", "fonts-dejavu-core", "python3"]

[[package.files]]
src = "files/tetronos-live-config/kmsconvt-autologin.conf"
dst = "usr/lib/systemd/system/kmsconvt@tty1.service.d/tetronos-autologin.conf"
mode = "0644"

[[package.files]]
src = "files/tetronos-live-config/tetron-session"
dst = "usr/bin/tetron-session"
mode = "0755"

[[package.files]]
src = "files/tetronos-live-config/tetronos-session.sh"
dst = "etc/profile.d/tetronos-session.sh"
mode = "0644"

[[package.files]]
src = "files/tetronos-live-config/tetronos-live-leave.service"
dst = "usr/lib/systemd/system/tetronos-live-leave.service"
mode = "0644"

[[package.files]]
src = "files/tetronos-live-config/live-ssh-password"
dst = "usr/libexec/tetronos/live-ssh-password"
mode = "0755"

[[package.files]]
src = "files/tetronos-live-config/ssh-live-password.conf"
dst = "usr/lib/systemd/system/ssh.service.d/tetronos-live-password.conf"
mode = "0644"

[[package.files]]
src = "files/tetronos-live-config/tetronos-live-ssh-password.path"
dst = "usr/lib/systemd/system/tetronos-live-ssh-password.path"
mode = "0644"

[[package.files]]
src = "files/tetronos-live-config/tetronos-live-ssh-password.service"
dst = "usr/lib/systemd/system/tetronos-live-ssh-password.service"
mode = "0644"

[[package.files]]
src = "files/tetronos-live-config/live-leave"
dst = "usr/libexec/tetronos/live-leave"
mode = "0755"

[package.scripts]
