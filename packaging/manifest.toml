[[package]]
name = "tetronos-desktop-config"
kind = "local"
version = "0.15.0"
revision = "3"
arch = "all"
section = "admin"
description = "TetronOS desktop: polkit rules for console logins and the desktop defaults"
long_description = """
kmscon runs the login on a pseudo terminal, so the session is not an
active seat session. These polkit rules let members of netdev manage
NetworkManager and members of users power off, reboot and suspend.
The first install also makes the machine behave as the Desktop ISO does:
the ssh server is installed but not enabled at boot (left alone when it is
running), the tetron-wm app server runs as a user service for every user,
and opencode, the agent of the tetron-wm Assistant, is installed into
/etc/skel and into home directories that lack it (upstream release, sha256
checked; a failed download only warns, Settings > Updates fetches it later).
"""
depends = ["polkitd", "openssh-server", "tetron-wm-desktop (>= 0.15.6)", "curl", "python3"]

[[package.files]]
src = "files/tetronos-desktop-config/50-tetronos-desktop.rules"
dst = "usr/share/polkit-1/rules.d/50-tetronos-desktop.rules"
mode = "0644"

[[package.files]]
src = "files/tetronos-desktop-config/desktop-opencode"
dst = "usr/libexec/tetronos/desktop-opencode"
mode = "0755"

[package.scripts]
postinst = "files/tetronos-desktop-config/postinst"

